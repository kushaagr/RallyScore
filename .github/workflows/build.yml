name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - 'README.md'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned so the Ubuntu 26 switch of "ubuntu-latest" can't break the build.
    runs-on: ubuntu-24.04
    env:
      # Optional custom signing key (see README). Leave unset to use keystore/shared.keystore.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Installs cmdline-tools and accepts the SDK licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Licenses are already accepted above, so no "yes |" pipe is needed.
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Use custom signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/RallyScore-${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: RallyScore-${{ github.run_number }}
          path: out/*.apk

      # Every push to the default branch refreshes a "latest" pre-release,
      # so the newest APK can be downloaded straight from the phone.
      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Automatic build of ${GITHUB_SHA::7}"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "$GITHUB_REF_NAME" --generate-notes
